[project]
name = "worship-ppt-generator"
version = "1.0.0"
description = "Generator de prezentări PowerPoint pentru versuri de cântece"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=0.6.21",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "flet>=0.10.0",
    "Pillow>=10.0.0"
]

[tool.flet]
main = "main.py"
product = "Worship PPT Generator"
company = "Worship App"

[tool.flet.windows]
build_number = 1
exclude = ["data", "output", "build", "venv", "__pycache__"]

[build-system]
requires = ["flet"]
build-backend = "flet"
